[package]
name = "allocation-kernel"
version = "0.1.0"
edition = "2021"
description = "Independent Rust allocation kernel. Reproduces the PRF reference allocation computation byte-for-byte at the declared public-output boundary."

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
serde_json = "1"
hex = "0.4"
prf-canonical-codec = { version = "0.1.0-rc.1", git = "https://github.com/protocol-robustness/prf-canonical.git", rev = "5e2b520feca812b049ba397b7b3681963c66a48c" }
prf-pro-rata-allocation = { version = "0.1.0-rc.1", git = "https://github.com/protocol-robustness/prf-pro-rata-allocation.git", rev = "48e0b362748cd39d09994a8aa1496c668199aa74" }

[[bin]]
name = "realized-statement-kernel"
path = "src/bin/realized_statement_kernel.rs"

[[bin]]
name = "controlled-entitlement-source-replay"
path = "src/bin/controlled_entitlement_source_replay.rs"
