[package]
name = "realized-statement-sp1-program"
version = "0.1.0"
edition = "2021"
description = "SP1 guest for the realized-allocation-statement core: a thin wrapper that reads the canonical realized-statement input document, runs the shared realized-fill core, and commits the statement root + six roots as public values."

[dependencies]
allocation-kernel = { path = "../core" }
sp1-zkvm = "6.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
