[workspace]
resolver = "2"
members = [
    "core",
    "sp1-program",
    "sp1-script",
    "realized-statement-sp1-program",
    "realized-execution-sp1-program",
    "source-bound-sp1-program",
    "source-bound-v2-sp1-program",
    "source-bound-entitlement-sp1-program",
    "controlled-entitlement-source-sp1-program",
    "observed-run-sp1-program",
    "accounting-arithmetic-sp1-program",
    "accounting-arithmetic-sp1-host",
    "exact-verifier-sp1-program",
    "exact-verifier-sp1-host",
]

# Profiles intended to affect the whole workspace build belong on the
# workspace-root manifest, not a member package (member-level profile tables
# are ignored with the "profiles for the non root package will be ignored"
# warning).
[profile.release]
opt-level = 3
