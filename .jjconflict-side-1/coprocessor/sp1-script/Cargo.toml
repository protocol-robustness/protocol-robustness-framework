[package]
name = "allocation-sp1-script"
version = "0.1.0"
edition = "2021"
description = "SP1 host script for the PRF allocation kernel: executes, proves, verifies, and generates EVM-compatible proof fixtures."

[build-dependencies]
sp1-build = "=6.3.1"

[dependencies]
sp1-sdk = { version = "=6.3.1", features = ["blocking", "native-gnark"] }
slop-algebra = "=6.3.1"
slop-bn254 = "=6.3.1"
sp1-hypercube = "=6.3.1"
sp1-prover = "=6.3.1"
sp1-prover-types = "=6.3.1"
sp1-recursion-circuit = "=6.3.1"
sp1-recursion-executor = "=6.3.1"
sp1-primitives = "=6.3.1"
sp1-recursion-gnark-ffi = { version = "=6.3.1", features = ["native"] }
allocation-kernel = { path = "../core" }
observed-run-sp1-program = { path = "../observed-run-sp1-program" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.0", features = ["derive", "env"] }
sha2 = "0.10"
bincode = "1.3"
num-bigint = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "allocation-prove"
path = "src/main.rs"

[[bin]]
name = "allocation-evm"
path = "src/bin/evm.rs"

[[bin]]
name = "allocation-vkey"
path = "src/bin/vkey.rs"

[[bin]]
name = "realized-statement-prove"
path = "src/bin/realized_statement_prove.rs"

[[bin]]
name = "realized-statement-verify"
path = "src/bin/realized_statement_verify.rs"

[[bin]]
name = "realized-execution-prove"
path = "src/bin/realized_execution_prove.rs"

[[bin]]
name = "realized-execution-evm"
path = "src/bin/realized_execution_evm.rs"

[[bin]]
name = "realized-statement-evm"
path = "src/bin/realized_statement_evm.rs"

[[bin]]
name = "source-bound-prove"
path = "src/bin/source_bound_prove.rs"

[[bin]]
name = "source-bound-v2-prove"
path = "src/bin/source_bound_v2_prove.rs"

[[bin]]
name = "source-bound-entitlement-prove"
path = "src/bin/source_bound_entitlement_prove.rs"

[[bin]]
name = "controlled-entitlement-source-prove"
path = "src/bin/controlled_entitlement_source_prove.rs"

[[bin]]
name = "observed-run-sp1-prove"
path = "src/bin/observed_run_sp1_prove.rs"

[[bin]]
name = "controlled-entitlement-source-resume"
path = "src/bin/controlled_entitlement_source_resume.rs"

[[bin]]
name = "controlled-entitlement-source-wrap"
path = "src/bin/controlled_entitlement_source_wrap.rs"
