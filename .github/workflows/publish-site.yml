name: DEPLOY · Website · Product site

# Build the PRF product/demo site from executable truth:
#
#   PRF tests
#     -> execute public scenarios
#     -> generate public-demo JSON
#     -> drift-check the committed artifact
#     -> build Next.js/Nextra
#     -> compose outputs
#     -> publish static site to GitHub Pages
#
# The site must not diverge from PRF: `bb demo:public-check` fails the build if
# the committed generated JSON no longer matches what the framework computes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'notebooks/**'
      - 'scripts/demos/**'
      - 'site/**'
      - 'bb.edn'
      - 'deps.edn'

# Grant write permission for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    name: Build - verify site against PRF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install-1.11.1.1413.sh -o /tmp/install-clojure.sh
          chmod +x /tmp/install-clojure.sh
          sudo /tmp/install-clojure.sh

      - name: Install Babashka
        run: |
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/install-bb.sh
          chmod +x /tmp/install-bb.sh
          sudo /tmp/install-bb.sh

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Demo assertion suites (incl. public projection)
        run: bb demo:test

      - name: Generate public-demo artifact
        run: bb demo:public-build

      - name: Fail on frontend/demo drift from PRF output
        run: bb demo:public-check

      - name: Drift-class test (corrupt/stale/missing artifact, no git)
        run: scripts/test_public_demo_drift.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Verify artifact cross-field/provenance consistency
        working-directory: site
        run: pnpm verify:demos

      - name: Build static site
        working-directory: site
        run: pnpm build

      - name: Compose Clerk lab (executable notebooks) into site output
        run: bb demo:public-lab

      - name: Verify every proof link resolves in the composed export
        run: scripts/verify_site_links.sh

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    name: Deploy - GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
