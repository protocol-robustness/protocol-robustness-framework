name: Unit and Framework Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  unit-and-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Clojure CLI
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install-1.11.1.1413.sh -o /tmp/install-clojure.sh
          chmod +x /tmp/install-clojure.sh
          sudo /tmp/install-clojure.sh

      - name: Install Babashka
        run: |
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/install-bb.sh
          chmod +x /tmp/install-bb.sh
          sudo /tmp/install-bb.sh

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Structural gate (commands, concepts, benchmarks, fmt, lint)
        run: bb backstop

      - name: Run framework unit tests (no Sew protocol)
        run: bb test:framework

      - name: Run full unit tests (framework + Sew)
        run: bb test:unit

      - name: Evidence-chain validation gate
        run: bb test:evidence

      - name: Notebook namespace validation
        run: bb test:notebooks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "test/forensic_python/requirements.txt"

      - name: Install Python test dependencies
        run: pip install -r test/forensic_python/requirements.txt

      - name: Run forensic Python tests (unit + golden bundle compatibility)
        run: bb test:forensic-python

      - name: Run forensic force-authorisation lifecycle validation tests
        run: bb test:forensic-validate

      - name: Validate public claim bindings
        run: |
          set +e
          bb public-claims:generate
          GENERATE_EXIT=$?
          bb claim-bindings:validate
          VALIDATE_EXIT=$?
          exit $((GENERATE_EXIT | VALIDATE_EXIT))

      - name: Upload claim-binding report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-binding-report
          path: target/claim-binding-report.json
          if-no-files-found: warn
