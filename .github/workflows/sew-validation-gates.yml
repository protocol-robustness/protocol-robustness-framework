name: VALIDATION · SEW · Protocol gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  # Gating job: RED only if PRF itself fails to run (structural/infrastructure or
  # core-verification failure). SEW findings within it are reported via the
  # continue-on-error steps and do not flip the workflow RED.
  core-validation:
    name: Gating - PRF core validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      xtdb:
        image: ghcr.io/xtdb/xtdb@sha256:15b6aa9d37d1e1a4e21748788db9275a57b87c339e5eb66d86376cf1e6899816
        ports:
          - 5432:5432
        env:
          XTDB_PGWIRE_PORT: 5432
          XTDB_PGWIRE_USER: xtdb
          XTDB_PGWIRE_PASSWORD: xtdb
          XTDB_DBNAME: xtdb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install-1.11.1.1413.sh -o /tmp/install-clojure.sh
          chmod +x /tmp/install-clojure.sh
          sudo /tmp/install-clojure.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Babashka
        run: |
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/install-bb.sh
          chmod +x /tmp/install-bb.sh
          sudo /tmp/install-bb.sh

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: CLI backstop (structural gate)
        timeout-minutes: 5
        run: clojure -M:cli/sew backstop

      - name: Unit tests
        timeout-minutes: 15
        run: ./scripts/test.sh unit

      - name: Reference validation
        timeout-minutes: 10
        run: clojure -M:reference-validation

      - name: Run invariant scenarios (expected findings reported, non-gating)
        continue-on-error: true
        timeout-minutes: 15
        run: ./scripts/test.sh invariants

      - name: Publish invariant findings to step summary
        if: always()
        run: |
          python3 scripts/ci/emit-step-summary.py \
            --label "SEW invariant scenarios" \
            --summary "${{ github.workspace }}/results/test-artifacts/test-summary.json" \
            --file "${{ github.workspace }}/results/test-artifacts/" || true

      - name: Run authoritative backstop (canonical invariant evidence)
        run: |
          echo "=== Running backstop:full ==="
          PRF_INVARIANTS_RUN_ROOT="$GITHUB_WORKSPACE/artf/runs/invariants/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            ./scripts/review/backstop.sh full
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: Upload invariant run root
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-run-root
          path: artf/runs/invariants/
          if-no-files-found: ignore

      - name: Generate ephemeral Ed25519 key for CI signing
        if: always()
        run: |
          ssh-keygen -t ed25519 -f test_key -N ''
          ls -l test_key*

      - name: Sign manifest with ephemeral key
        if: always()
        run: |
          mkdir -p results/ci-bundle
          clojure -M -m resolver-sim.scripts.evidence sign ./test_key || true

      - name: Verify signature with public key
        if: always()
        run: |
          ssh-keygen -e -f test_key -m PKCS8 > test_key.pub.pem || true
          clojure -M -m resolver-sim.scripts.verify-signature test_key.pub.pem || true

      - name: Export evidence bundle (CI)
        if: always()
        run: |
          mkdir -p results/ci-bundle
          bb evidence:bundle results/ci-bundle || echo "Warning: evidence bundle export failed (run may be incomplete)"
          ls -la results/ci-bundle || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: results/test-artifacts/
          if-no-files-found: ignore

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bundle
          path: results/ci-bundle/
          if-no-files-found: ignore

  # Extended (informational, non-gating) validation targets run in parallel on
  # their own runner VMs instead of serially inside core-validation. Each has
  # its own workspace, so there is no shared-artifact race, and none of them
  # gate the run (continue-on-error: true), mirroring the prior semantics.
  extended-validation:
    name: Informational - extended SEW validation
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: integration,    cmd: "bb test:integration",       python: true,  test-timeout: 15 }
          - { name: contracts,      cmd: "./scripts/test.sh contracts", python: true, test-timeout: 10 }
          - { name: triage,         cmd: "./scripts/test.sh triage",    python: false, test-timeout: 10 }
          - { name: monte-carlo,    cmd: "./scripts/test.sh monte-carlo", python: false, test-timeout: 20 }
          - { name: dr3-coverage,   cmd: "./scripts/test.sh dr3-coverage", python: false, test-timeout: 15 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install-1.11.1.1413.sh -o /tmp/install-clojure.sh
          chmod +x /tmp/install-clojure.sh
          sudo /tmp/install-clojure.sh

      - name: Install Babashka
        run: |
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/install-bb.sh
          chmod +x /tmp/install-bb.sh
          sudo /tmp/install-bb.sh

      - name: Setup Python
        if: matrix.python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run ${{ matrix.name }}
        timeout-minutes: ${{ matrix.test-timeout }}
        run: ${{ matrix.cmd }}

      - name: Publish findings to step summary
        if: always()
        run: |
          python3 scripts/ci/emit-step-summary.py \
            --label "extended SEW: ${{ matrix.name }}" \
            --summary "${{ github.workspace }}/results/test-artifacts/test-summary.json" \
            --file "${{ github.workspace }}/results/test-artifacts/" || true

      - name: Upload ${{ matrix.name }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: results/test-artifacts/
          if-no-files-found: ignore

  coverage-gates:
    name: Gating - transition/guard coverage
    runs-on: ubuntu-latest
    needs: core-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install-1.11.1.1413.sh -o /tmp/install-clojure.sh
          chmod +x /tmp/install-clojure.sh
          sudo /tmp/install-clojure.sh

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run transition/guard coverage gate
        env:
          MAX_UNHIT_TRANSITIONS: "4"
        run: ./scripts/test.sh coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifact
          path: results/test-artifacts/coverage.json


  equivalence-comparison-gates:
    name: Informational - equivalence comparison
    runs-on: ubuntu-latest
    needs: [core-validation, comparison-schema-gates]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install-1.11.1.1413.sh -o /tmp/install-clojure.sh
          chmod +x /tmp/install-clojure.sh
          sudo /tmp/install-clojure.sh

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run equivalence comparison gates
        run: ./scripts/test.sh equivalence-new

      - name: Upload equivalence test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-test-artifacts
          path: results/test-artifacts/

  comparison-schema-gates:
    name: Informational - comparison metadata lint
    runs-on: ubuntu-latest
    needs: core-validation
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install-1.11.1.1413.sh -o /tmp/install-clojure.sh
          chmod +x /tmp/install-clojure.sh
          sudo /tmp/install-clojure.sh

      - name: Run comparison metadata lint
        run: ./scripts/test.sh comparison-lint || true

      - name: Upload comparison lint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-lint-artifacts
          path: results/test-artifacts/

  # Consolidates every job's artifact bundle into a single unified
  # test-artifacts.json + test-run.json for the run, then gates it with the
  # strengthened artifact audit (scripts/evidence/audit_artifacts.py).
  # Content conflicts between bundles (the same artifact path claimed with
  # different bytes) fail this job with a specific report rather than being
  # silently clobbered.
  consolidate-artifacts:
    name: Consolidate - audit unified artifacts
    runs-on: ubuntu-latest
    needs:
      - core-validation
      - extended-validation
      - coverage-gates
      - equivalence-comparison-gates
      - comparison-schema-gates
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install jsonschema

      - name: Download artifact bundles
        uses: actions/download-artifact@v4
        with:
          pattern: '*artifact*'
          path: unified/
          if-no-files-found: warn

      - name: Consolidate into unified registry and audit
        run: |
          ls -la unified/ || true
          ./scripts/evidence/consolidate_ci.sh \
            unified \
            results/unified \
            "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload unified artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-unified
          path: results/unified/
          if-no-files-found: ignore
