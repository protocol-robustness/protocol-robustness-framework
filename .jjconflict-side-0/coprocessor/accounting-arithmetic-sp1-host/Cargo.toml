[package]
name = "accounting-arithmetic-sp1-host"
version = "0.1.0"
edition = "2021"
description = "SP1 host for the checked-i64 PRF accounting arithmetic statement."

[build-dependencies]
sp1-build = "=6.3.1"

[dependencies]
sp1-sdk = { version = "=6.3.1", features = ["blocking"] }
allocation-kernel = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.0", features = ["derive"] }
sha2 = "0.10"
bincode = "1.3"
