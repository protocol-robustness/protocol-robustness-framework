[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = true
allow_paths = ["../", "../../../../../prf-evm"]

# This conformance fixture composes the neighboring, existing PRF EVM checkout.
remappings = [
    "ao-prototype/=../",
    "prf-evm/=../../../../../prf-evm/",
    "@openzeppelin/contracts/=../../../../../prf-evm/lib/openzeppelin-contracts/contracts/"
]
