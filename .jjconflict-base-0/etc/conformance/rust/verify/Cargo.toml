[package]
name = "resubmission-conformance"
version = "0.1.0"
edition = "2021"
description = "Independent Rust conformance verifier for frozen canonical transition vectors"

[features]
legacy-conformance = []

[lib]
name = "resubmission_conformance"
path = "src/lib.rs"

[[bin]]
name = "verify"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["pem"] }
