---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Deploy PRF site nginx configuration
  template:
    src: prf-site.conf.j2
    dest: /etc/nginx/sites-available/prf-site
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx

- name: Enable PRF site
  file:
    path: /etc/nginx/sites-enabled/prf-site
    src: /etc/nginx/sites-available/prf-site
    state: link
  notify: reload nginx

- name: Ensure nginx is running and enabled
  systemd:
    name: nginx
    state: started
    enabled: yes

- name: Test nginx configuration
  command: nginx -t
  changed_when: false
  notify: reload nginx
