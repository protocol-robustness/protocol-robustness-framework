---
- name: Install PostgreSQL
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - postgresql-client
    state: present
    update_cache: yes

- name: Ensure PostgreSQL is running and enabled
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: Create PRF lab database user
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgresql_users[0].name }}"
    password: "{{ postgresql_users[0].password }}"
    priv: "CONNECTION LIMIT 10"
    state: present

- name: Create PRF lab database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgresql_databases[0].name }}"
    owner: "{{ postgresql_databases[0].owner }}"
    state: present

- name: Configure pg_hba.conf
  community.postgresql.postgresql_pg_hba:
    dest: "/etc/postgresql/{{ postgresql_version.stdout }}/main/pg_hba.conf"
    entries: "{{ postgresql_hba_entries }}"
  notify: reload postgresql

- name: Get PostgreSQL version
  command: psql --version
  register: postgresql_version
  changed_when: false

- name: Ensure PostgreSQL listens on localhost
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version.stdout | regex_search('[0-9]+') }}/main/postgresql.conf"
    regexp: "^#?listen_addresses"
    line: "listen_addresses = 'localhost'"
  notify: restart postgresql

- name: Test database connection
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ postgresql_databases[0].name }}"
    query: "SELECT 1"
  changed_when: false
