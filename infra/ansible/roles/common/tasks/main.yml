---
- name: Install base system packages
  apt:
    name:
      - git
      - curl
      - wget
      - unzip
      - ca-certificates
      - python3
      - python3-pip
      - awscli
      - coreutils
    state: present
    update_cache: yes

- name: Install OpenJDK 21
  apt:
    name: openjdk-21-jdk
    state: present
    update_cache: yes

- name: Verify Java installation
  command: java -version
  register: java_version
  changed_when: false
  failed_when: java_version.rc != 0

- name: Install Clojure CLI
  get_url:
    url: https://download.clojure.org/install/linux-install-1.12.5.1654.sh
    dest: /tmp/install-clojure.sh
    mode: '0755'
  notify: run clojure installer

- name: Install Babashka
  apt:
    deb: https://github.com/babashka/babashka/releases/download/v1.3.190/babashka-1.3.190-linux-arm64.deb
    state: present
  when: ansible_architecture == 'aarch64'

- name: Install Babashka (amd64)
  apt:
    deb: https://github.com/babashka/babashka/releases/download/v1.3.190/babashka-1.3.190-linux-amd64.deb
    state: present
  when: ansible_architecture != 'aarch64'

- name: Install Node.js 22
  shell: |
    curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    apt-get install -y nodejs
  args:
    creates: /usr/bin/node

- name: Install pnpm
  shell: npm install -g pnpm@11.9.0
  args:
    creates: /usr/local/bin/pnpm

- name: Verify toolchain
  command: "{{ item }}"
  loop:
    - "java -version"
    - "clojure -Sdescribe"
    - "bb --version"
    - "node --version"
    - "pnpm --version"
  changed_when: false
  register: toolchain_versions

- name: Show toolchain versions
  debug:
    msg: "{{ item.stdout | default(item.stderr) | default('unknown') }}"
  loop: "{{ toolchain_versions.results }}"
  loop_control:
    label: "{{ item.item }}"
