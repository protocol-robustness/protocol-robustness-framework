---
- name: Create secure directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - "{{ prf_project_dir }}"
    - "{{ prf_project_dir }}/site/out"
    - "{{ lab_runs_dir }}"
    - /secure/operator-keys
    - /secure/operator-policy

- name: Deploy PRF repo
  synchronize:
    src: "{{ playbook_dir }}/../../../"
    dest: "{{ prf_project_dir }}/"
    delete: no
    recursive: yes
    exclude:
      - .git/
      - node_modules/
      - target/
      - results/
      - .cpcache/
      - .clj-kondo/
      - .lsp/
      - .idea/
      - .vscode/
      - .next/
      - .clerk/
  delegate_to: "{{ inventory_hostname }}"

- name: Generate test Ed25519 signing keypair (if not present)
  command: ssh-keygen -t ed25519 -f /secure/operator-keys/release-signing-key -C "assurance-lab-signer" -N "" -q
  args:
    creates: /secure/operator-keys/release-signing-key
  become: yes

- name: Set permissions on private key
  file:
    path: /secure/operator-keys/release-signing-key
    mode: '0600'
    owner: root
    group: root

- name: Get public key content
  command: cut -d' ' -f2 /secure/operator-keys/release-signing-key.pub
  register: lab_public_key
  changed_when: false

- name: Deploy active trust policy
  copy:
    dest: /secure/operator-policy/trust-policy.edn
    content: |
      {:schema-version "prf-release-trust-policy.v1"
       :policy-id :release/assurance-lab-v1
       :policy/status :active
       :policy-version 1
       :trusted-keys
       [{:key-id "{{ lab_signer_key_id }}"
         :status :active
         :public-key "{{ lab_public_key.stdout }}"}]
       :requirements
       {:distribution
        {:prf {:minimum-valid-signatures 1}
         :sew {:minimum-valid-signatures 1}}}
       :canonicalization
       {:payload-profile "prf-release-attestation-payload.v1"}
       :operator-note
       "Lab-only active policy. Replace with organization-enrolled keys and thresholds before production use."}
    owner: root
    group: root
    mode: '0644'

- name: Install myapp systemd service (Lab HTTP server)
  copy:
    dest: /etc/systemd/system/myapp.service
    content: |
      [Unit]
      Description=PRF Lab HTTP Server
      After=network.target

      [Service]
      Type=simple
      WorkingDirectory={{ prf_project_dir }}
      Environment="LAB_RUNS_DIR={{ lab_runs_dir }}"
      Environment="LAB_PUBLISH_BUCKET={{ lab_publish_bucket }}"
      Environment="LAB_REGION={{ lab_region }}"
      ExecStartPre=/usr/local/bin/bb build:prf
      ExecStart=/usr/bin/java -jar {{ prf_project_dir }}/target/prf.jar -m resolver-sim.lab.http 8082
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: '0644'
  notify: systemctl daemon-reload

- name: Install prf-attestation systemd service
  copy:
    dest: /etc/systemd/system/prf-attestation.service
    content: |
      [Unit]
      Description=PRF Release Attestation Runner
      After=network.target

      [Service]
      Type=oneshot
      WorkingDirectory={{ prf_project_dir }}
      Environment="LAB_RUNS_DIR={{ lab_runs_dir }}"
      Environment="LAB_PUBLISH_BUCKET={{ lab_publish_bucket }}"
      Environment="LAB_REGION={{ lab_region }}"
      ExecStartPre=/usr/local/bin/bb build:attest
      ExecStart=/usr/local/bin/bb build:attest:sign target/default-build-attestation-prf.edn prf {{ lab_signer_key_id }} /secure/operator-keys/release-signing-key '{{ lab_release_metadata }}'
      RemainAfterExit=yes
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: '0644'
  notify: systemctl daemon-reload

- name: Enable and start myapp
  systemd:
    name: myapp
    enabled: yes
    state: started

- name: Enable prf-attestation (runs on boot, can be triggered manually)
  systemd:
    name: prf-attestation
    enabled: yes
    state: started
