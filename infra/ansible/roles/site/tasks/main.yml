---
- name: Install Node.js dependencies for site
  command: pnpm install
  args:
    chdir: "{{ prf_project_dir }}/site"

- name: Build static export
  command: pnpm build
  args:
    chdir: "{{ prf_project_dir }}/site"

- name: Ensure nginx document root exists
  file:
    path: "{{ prf_project_dir }}/site/out"
    state: directory
    mode: '0755'

- name: Verify site was built
  stat:
    path: "{{ prf_project_dir }}/site/out/index.html"
  register: site_index

- name: Fail if site was not built
  fail:
    msg: "Site static export not found at {{ prf_project_dir }}/site/out/index.html"
  when: not site_index.stat.exists
